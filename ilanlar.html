<body data-page="ilanlar">
  <header class="site-header">
    <div class="container header-in">
      <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg></span>Emlak<span class="ai">AI</span></a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html">Ana Sayfa</a>
        <a href="ilanlar.html" class="active">İlanlar</a>
        <a href="degerleme.html">Değerleme</a>

      </nav>
      <button class="icon-btn" id="themeToggle" title="Tema değiştir">🌙</button>
      <button class="icon-btn menu-toggle" id="menuToggle" title="Menü">☰</button>
    </div>
  </header>

  <main>
    <div class="container page-head">
      <h1>İlanlar</h1>
      <p>Filtrelerle daraltın; her ilan yapay zekâ fiyat etiketiyle gösterilir.</p>
    </div>

    <div class="container">
      <div class="ai-note" id="aiNote" style="display:none"></div>
    </div>

    <div class="container listing-layout">
      <aside class="filters">
        <h3>Filtreler <button class="btn ghost sm" id="clearBtn" type="button">Temizle</button></h3>
        <div><label for="fSeg">Segment</label>
          <select id="fSeg"><option value="emlak">Taşınmaz</option><option value="vasita">Araç</option></select>
        </div>
        <div><label for="fCat">Kategori</label>
          <select id="fCat"><option value="">Tümü</option><option value="satilik">Satılık</option><option value="kiralik">Kiralık</option></select>
        </div>
        <div><label for="fCity">Şehir</label><select id="fCity"></select></div>
        <div><label for="fDistrict">İlçe</label><select id="fDistrict"></select></div>
        <div class="f-emlak"><label for="fKind">Tür</label><select id="fKind"></select></div>
        <div class="f-emlak"><label for="fRooms">Oda Sayısı</label>
          <select id="fRooms"><option value="">Tümü</option><option>1+0</option><option>1+1</option><option>2+1</option><option>3+1</option><option>4+1</option><option>5+2</option></select>
        </div>
        <div class="f-vasita"><label for="fBrand">Marka</label><select id="fBrand"></select></div>
        <div class="f-vasita"><label for="fModel">Model</label><select id="fModel"></select></div>
        <div class="f-vasita"><label>Yıl / Kilometre</label>
          <div class="row2">
            <input id="fMinYear" type="number" min="2008" placeholder="Min yıl" aria-label="En düşük model yılı">
            <input id="fMaxKm" type="number" min="0" placeholder="Max km" aria-label="En yüksek kilometre">
          </div>
        </div>
        <div class="f-vasita"><label for="fFuel">Yakıt</label><select id="fFuel"></select></div>
        <div class="f-vasita"><label for="fGear">Vites</label><select id="fGear"></select></div>
        <div><label>Fiyat Aralığı (₺)</label>
          <div class="row2">
            <input id="fMin" type="number" min="0" placeholder="Min" aria-label="En düşük fiyat (₺)">
            <input id="fMax" type="number" min="0" placeholder="Max" aria-label="En yüksek fiyat (₺)">
          </div>
        </div>
        <button class="btn" id="applyBtn" type="button">Uygula</button>
      </aside>

      <div>
        <div class="toolbar">
          <span class="count" id="count">—</span>
          <div>
            <button class="btn ghost sm filters-toggle" id="filtersToggle" type="button">Filtreler</button>
            <label for="fSort" style="display:inline;margin-right:6px">Sırala:</label>
            <select id="fSort">
              <option value="new">En Yeni</option>
              <option value="ai">Fırsat Skoru</option>
              <option value="price-asc">Fiyat (Artan)</option>
              <option value="price-desc">Fiyat (Azalan)</option>
              <option value="m2">Alan (m²)</option>
            </select>
          </div>
        </div>
        <div class="grid" id="grid"></div>
        <nav class="pager" id="pager" aria-label="Sayfalar"></nav>
      </div>
    </div>
  </main>
